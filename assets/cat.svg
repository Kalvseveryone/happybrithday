<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffd1dc"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="100%" stop-color="#ff7597"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff4d6d" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Ears -->
    <path d="M 50 70 L 30 25 L 75 45 Z" fill="#fff" stroke="#ff85a1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 52 65 L 36 32 L 70 47 Z" fill="url(#earInner)"/>
    
    <path d="M 150 70 L 170 25 L 125 45 Z" fill="#fff" stroke="#ff85a1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 148 65 L 164 32 L 130 47 Z" fill="url(#earInner)"/>
    
    <!-- Head -->
    <ellipse cx="100" cy="90" rx="60" ry="50" fill="url(#catBody)" stroke="#ff85a1" stroke-width="3"/>
    
    <!-- Cheeks (Blush) -->
    <ellipse cx="60" cy="98" rx="10" ry="6" fill="#ff7597" opacity="0.6"/>
    <ellipse cx="140" cy="98" rx="10" ry="6" fill="#ff7597" opacity="0.6"/>
    
    <!-- Eyes -->
    <ellipse cx="70" cy="85" rx="6" ry="8" fill="#4a3b32"/>
    <circle cx="68" cy="83" r="2.5" fill="#ffffff"/>
    <ellipse cx="130" cy="85" rx="6" ry="8" fill="#4a3b32"/>
    <circle cx="128" cy="83" r="2.5" fill="#ffffff"/>
    
    <!-- Nose & Mouth -->
    <polygon points="96,96 104,96 100,101" fill="#ff4d6d"/>
    <path d="M 94 103 Q 100 108 100 103 Q 100 108 106 103" fill="none" stroke="#4a3b32" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <path d="M 40 88 L 15 84 M 40 94 L 10 94 M 40 100 L 18 104" stroke="#ff85a1" stroke-width="2" stroke-linecap="round"/>
    <path d="M 160 88 L 185 84 M 160 94 L 190 94 M 160 100 L 182 104" stroke="#ff85a1" stroke-width="2" stroke-linecap="round"/>

    <!-- Flower on Ear -->
    <g transform="translate(145, 45) scale(0.6)">
      <circle cx="-10" cy="0" r="8" fill="#ffb7c5"/>
      <circle cx="10" cy="0" r="8" fill="#ffb7c5"/>
      <circle cx="0" cy="-10" r="8" fill="#ffb7c5"/>
      <circle cx="0" cy="10" r="8" fill="#ffb7c5"/>
      <circle cx="0" cy="0" r="6" fill="#ffe066"/>
    </g>

    <!-- Body -->
    <path d="M 55 125 C 50 170, 150 170, 145 125 Z" fill="url(#catBody)" stroke="#ff85a1" stroke-width="3"/>
    
    <!-- Paws -->
    <ellipse cx="75" cy="155" rx="12" ry="8" fill="#fff" stroke="#ff85a1" stroke-width="2"/>
    <ellipse cx="125" cy="155" rx="12" ry="8" fill="#fff" stroke="#ff85a1" stroke-width="2"/>
    
    <!-- Heart in paws -->
    <path d="M 100 148 C 100 145 92 138 87 143 C 82 148 90 156 100 162 C 110 156 118 148 113 143 C 108 138 100 145 100 148 Z" fill="#ff4d6d"/>
  </g>
</svg>